services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    volumes:
      - ../:/workspace
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: python

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
